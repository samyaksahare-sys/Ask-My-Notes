server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for unknown paths instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a rebuild keeps serving stale asset
    # references after the hashed files behind them have changed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;
}
